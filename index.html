<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OCR Pro MAX (Handwriting + Layout Fix)</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Excel with STYLES (borders support) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>
body{font-family:Arial;background:#f5f7fb;padding:20px;text-align:center}
.container{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:12px}
video{width:100%;border-radius:10px}
button{width:100%;padding:12px;margin-top:10px;font-weight:bold;border:none;border-radius:8px}
#scan{background:#007bff;color:#fff}
#txt{background:#28a745;color:#fff}
#pdf{background:#ff9800;color:#fff}
#excel{background:#6f42c1;color:#fff}
textarea{width:100%;height:180px;margin-top:10px}
</style>
</head>

<body>

<div class="container">

<h2>📸 OCR PRO MAX (Handwriting Fix)</h2>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<button id="scan">📷 Scan Document</button>

<p id="status">Starting camera...</p>

<textarea id="output"></textarea>

<button id="txt" disabled>TXT</button>
<button id="pdf" disabled>PDF</button>
<button id="excel" disabled>EXCEL (WITH BORDERS)</button>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const output = document.getElementById("output");
const status = document.getElementById("status");

const scanBtn = document.getElementById("scan");
const txtBtn = document.getElementById("txt");
const pdfBtn = document.getElementById("pdf");
const excelBtn = document.getElementById("excel");


// ================= CAMERA =================
async function startCamera(){
try{
const stream = await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
});
video.srcObject = stream;
status.innerText = "✅ Camera Ready";
}catch(e){
status.innerText = "❌ Camera Error";
}
}
startCamera();


// ================= IMAGE PREPROCESS (IMPORTANT FOR HANDWRITING) =================
function preprocess(ctx, w, h){

let img = ctx.getImageData(0,0,w,h);
let d = img.data;

// grayscale + contrast boost
for(let i=0;i<d.length;i+=4){
let avg = (d[i]+d[i+1]+d[i+2])/3;

// contrast improvement
avg = avg < 128 ? avg*0.8 : avg*1.2;

d[i]=d[i+1]=d[i+2]=avg;
}

ctx.putImageData(img,0,0);
}


// ================= SCAN =================
scanBtn.onclick = async () => {

scanBtn.disabled = true;
status.innerText = "⏳ Processing Image...";

const ctx = canvas.getContext("2d");
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

ctx.drawImage(video,0,0);

// 🔥 preprocessing for handwriting
preprocess(ctx,canvas.width,canvas.height);

const image = canvas.toDataURL("image/jpeg",0.9);

const form = new FormData();
form.append("base64Image",image);
form.append("apikey","helloworld");

// 🔥 BEST OCR SETTINGS
form.append("OCREngine","2");
form.append("detectOrientation","true");
form.append("scale","true");
form.append("isTable","true");

try{

const res = await fetch("https://api.ocr.space/parse/image",{
method:"POST",
body:form
});

const data = await res.json();

scanBtn.disabled = false;

if(data.ParsedResults){

let text = data.ParsedResults[0].ParsedText || "";

// 🔥 layout cleaning (important)
text = text
.replace(/\r/g,"")
.replace(/[ \t]+/g," ")
.replace(/\n{3,}/g,"\n\n");

output.value = text;

status.innerText = "✅ Scan Complete";

// enable buttons
txtBtn.disabled = false;
pdfBtn.disabled = false;
excelBtn.disabled = false;

}else{
status.innerText = "❌ No Text Found";
}

}catch(e){
scanBtn.disabled = false;
status.innerText = "❌ Server Error";
}

};


// ================= TXT =================
txtBtn.onclick = () => {
const blob = new Blob([output.value],{type:"text/plain"});
const a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "scan.txt";
a.click();
};


// ================= PDF =================
pdfBtn.onclick = () => {
const { jsPDF } = window.jspdf;
const doc = new jsPDF();

const lines = doc.splitTextToSize(output.value,180);
doc.text(lines,10,10);

doc.save("scan.pdf");
};


// ================= EXCEL WITH BORDERS =================
excelBtn.onclick = () => {

let rows = output.value.split("\n").map(r => [r]);

let wb = XLSX.utils.book_new();

let ws = XLSX.utils.aoa_to_sheet(rows);

// 🔥 add borders
for(let r in ws){
if(typeof ws[r] === "object"){
ws[r].s = {
border:{
top:{style:"thin"},
bottom:{style:"thin"},
left:{style:"thin"},
right:{style:"thin"}
}
}
}
}

ws["!cols"] = [{wch:60}];

XLSX.utils.book_append_sheet(wb,ws,"OCR");

XLSX.writeFile(wb,"scan.xlsx");
};

</script>

</body>
</html>

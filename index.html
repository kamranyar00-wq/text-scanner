<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Document Scanner Pro (Exact Copy)</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    font-family:Arial;
    background:#f5f6fb;
    padding:20px;
    text-align:center;
}

.container{
    max-width:600px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:12px;
}

video{
    width:100%;
    border-radius:10px;
    background:black;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

#scan{background:#007bff;color:white;}
#pdf{background:#ff9800;color:white;}

#status{
    margin-top:10px;
    font-weight:bold;
}

img{
    width:100%;
    margin-top:10px;
    border:1px solid #ccc;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<h2>📄 Document Scanner Pro (Exact Copy)</h2>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<button id="scan">📷 Scan Document</button>

<p id="status">Camera starting...</p>

<img id="preview"/>

<button id="pdf">📄 Download EXACT PDF</button>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");
const status = document.getElementById("status");

let lastImage = null;

// ================= CAMERA =================
async function startCamera(){
const stream = await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
});
video.srcObject = stream;
status.innerText = "✅ Camera Ready";
}
startCamera();


// ================= SCAN FULL PAGE =================
document.getElementById("scan").onclick = () => {

const ctx = canvas.getContext("2d");

canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

ctx.drawImage(video,0,0);

lastImage = canvas.toDataURL("image/jpeg",1.0);

preview.src = lastImage;

status.innerText = "✅ Document Captured (Exact Copy)";
};


// ================= PDF (REAL SCANNER STYLE) =================
document.getElementById("pdf").onclick = () => {

if(!lastImage) return;

const { jsPDF } = window.jspdf;

const doc = new jsPDF("p","mm","a4");

// full page image (no text conversion)
doc.addImage(lastImage,"JPEG",0,0,210,297);

// 🔥 FOOTER ADDED (your requirement)
doc.setFontSize(10);
doc.text("Powered by Kamran Akhtar", 70, 290);

doc.save("scanned_document.pdf");
};

</script>

</body>
</html>

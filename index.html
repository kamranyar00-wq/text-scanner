<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OCR Pro MAX Scanner</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Excel -->
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

<style>
body{
    font-family:Arial;
    background:#f4f6fb;
    padding:20px;
    text-align:center;
}

.container{
    max-width:600px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
}

video{
    width:100%;
    border-radius:10px;
    background:black;
}

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

#scan{background:#007bff;color:white;}
#txt{background:#28a745;color:white;}
#pdf{background:#ff9800;color:white;}
#excel{background:#6f42c1;color:white;}

textarea{
    width:100%;
    height:180px;
    margin-top:10px;
    padding:10px;
}
</style>
</head>

<body>

<div class="container">

<h2>📸 OCR Pro MAX (Fixed Version)</h2>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<button id="scan">📷 Scan Document</button>

<p id="status">Starting camera...</p>

<textarea id="output" placeholder="Scanned text will appear here..."></textarea>

<button id="txt" disabled>📥 Download TXT</button>
<button id="pdf" disabled>📄 Download PDF</button>
<button id="excel" disabled>📊 Download Excel</button>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const output = document.getElementById("output");
const status = document.getElementById("status");

const scanBtn = document.getElementById("scan");
const txtBtn = document.getElementById("txt");
const pdfBtn = document.getElementById("pdf");
const excelBtn = document.getElementById("excel");


// ================= CAMERA =================
async function startCamera(){
try{
const stream = await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
});
video.srcObject = stream;
status.innerText = "✅ Camera Ready";
}catch(e){
status.innerText = "❌ Camera Error";
}
}
startCamera();


// ================= IMAGE PREPROCESS (IMPORTANT FIX FOR MISSING WORDS) =================
function preprocess(ctx, w, h){

let img = ctx.getImageData(0,0,w,h);
let d = img.data;

for(let i=0;i<d.length;i+=4){

// grayscale
let gray = 0.3*d[i] + 0.59*d[i+1] + 0.11*d[i+2];

// 🔥 IMPORTANT: better balance (not too harsh black/white)
gray = gray > 130 ? 255 : gray * 0.6;

// contrast boost
gray = gray * 1.2;

d[i]=d[i+1]=d[i+2]=gray;
}

ctx.putImageData(img,0,0);
}


// ================= SCAN =================
scanBtn.onclick = async () => {

scanBtn.disabled = true;
status.innerText = "⏳ Scanning...";

const ctx = canvas.getContext("2d");

canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

// improve capture quality
ctx.filter = "contrast(150%) brightness(120%)";
ctx.drawImage(video,0,0);

preprocess(ctx,canvas.width,canvas.height);

const image = canvas.toDataURL("image/jpeg",0.9);

const form = new FormData();
form.append("base64Image",image);
form.append("apikey","helloworld");

// 🔥 BEST OCR SETTINGS
form.append("OCREngine","2");
form.append("scale","true");
form.append("detectOrientation","true");
form.append("isOverlayRequired","true");
form.append("isTable","true");
form.append("filetype","jpg");

try{

const res = await fetch("https://api.ocr.space/parse/image",{
method:"POST",
body:form
});

const data = await res.json();

scanBtn.disabled = false;

if(data.ParsedResults){

let text = data.ParsedResults[0].ParsedText || "";

// 🔥 CLEAN TEXT (FIX MISSING SPACES / LINES)
text = text
.replace(/\r/g,"")
.replace(/[ \t]+/g," ")
.replace(/\n{3,}/g,"\n\n")
.trim();

output.value = text;

status.innerText = "✅ Scan Complete";

txtBtn.disabled = false;
pdfBtn.disabled = false;
excelBtn.disabled = false;

}else{
status.innerText = "❌ No Text Found";
}

}catch(e){
scanBtn.disabled = false;
status.innerText = "❌ Server Error";
}

};


// ================= TXT =================
txtBtn.onclick = () => {
const blob = new Blob([output.value],{type:"text/plain"});
const a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "scan.txt";
a.click();
};


// ================= PDF =================
pdfBtn.onclick = () => {
const { jsPDF } = window.jspdf;
const doc = new jsPDF();

const lines = doc.splitTextToSize(output.value,180);
doc.text(lines,10,10);

doc.save("scan.pdf");
};


// ================= EXCEL =================
excelBtn.onclick = () => {

let rows = output.value.split("\n").map(r => [r]);

let wb = XLSX.utils.book_new();
let ws = XLSX.utils.aoa_to_sheet(rows);

// column width
ws["!cols"] = [{wch:60}];

XLSX.utils.book_append_sheet(wb,ws,"OCR");

XLSX.writeFile(wb,"scan.xlsx");
};

</script>

</body>
</html>

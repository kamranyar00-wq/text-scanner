<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Super Fast Free OCR & Excel Scanner</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f7f6;
    padding:20px;
    text-align:center;
}

.container{
    max-width:550px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h2{
    margin-bottom:15px;
    color:#333;
}

video{
    width:100%;
    max-height:400px;
    border-radius:10px;
    background:black;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

#capture-btn{
    background:#007bff;
    color:white;
}

#capture-btn:hover{
    background:#0056b3;
}

.download-btn{
    background:#28a745;
    color:white;
}

.download-btn:hover{
    background:#1f7e34;
}

#download-excel{
    background:#ff9800;
    color:white;
}

#download-excel:hover{
    background:#e68a00;
}

button:disabled{
    background:#cccccc;
    cursor:not-allowed;
}

#status{
    margin-top:15px;
    font-weight:bold;
    color:#ff5722;
}

textarea{
    width:100%;
    height:180px;
    margin-top:15px;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    resize:none;
    font-size:15px;
}

canvas{
    display:none;
}
</style>
</head>

<body>

<div class="container">
    <h2>📸 Paper To Text & Excel Scanner</h2>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <button id="capture-btn">
        📷 Capture & Scan Text
    </button>

    <div id="status">
        Status: Camera Starting...
    </div>

    <textarea
        id="output-box"
        placeholder="Scanned text will appear here..."
    ></textarea>

    <button id="download-txt"
        class="download-btn"
        disabled>
        📥 Download TXT
    </button>

    <button id="download-pdf"
        class="download-btn"
        disabled>
        📄 Download PDF
    </button>

    <button id="download-excel"
        class="download-btn"
        disabled>
        📊 Download EXCEL (.xlsx)
    </button>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const captureBtn = document.getElementById("capture-btn");
const outputBox = document.getElementById("output-box");
const statusText = document.getElementById("status");
const downloadTxtBtn = document.getElementById("download-txt");
const downloadPdfBtn = document.getElementById("download-pdf");
const downloadExcelBtn = document.getElementById("download-excel");

let currentStream = null;

function loadScript(src){
    return new Promise((resolve)=>{
        const s = document.createElement("script");
        s.src = src;
        s.onload = ()=> resolve(true);
        s.onerror = ()=> resolve(false);
        document.head.appendChild(s);
    });
}

// CAMERA START
async function startCamera(){

    try{

        if(currentStream){
            currentStream.getTracks().forEach(track=>track.stop());
        }

        const constraints = {
            video:{
                facingMode:{ ideal:"environment" },
                width:{ ideal:1280 },
                height:{ ideal:720 }
            },
            audio:false
        };

        currentStream =
            await navigator.mediaDevices
            .getUserMedia(constraints);

        video.srcObject = currentStream;

        await video.play();

        statusText.innerText =
            "✅ Back Camera Loaded Successfully";

    } catch(error){

        console.error(error);

        try{

            currentStream =
                await navigator.mediaDevices
                .getUserMedia({
                    video:true,
                    audio:false
                });

            video.srcObject = currentStream;

            await video.play();

            statusText.innerText =
                "✅ Camera Active (Auto Mode)";

        } catch(finalError){

            console.error(finalError);

            statusText.innerText =
                "❌ Camera Blocked. Allow Camera Permission.";
        }
    }
}

startCamera();

// OCR SCAN
captureBtn.addEventListener(
"click",
async ()=>{

try{

captureBtn.disabled = true;
outputBox.value = "";

statusText.innerText =
"⏳ Loading OCR Engine...";

// FIXED CDN LINKS
const cdnjs =
"https://cdnjs.cloudflare.com/ajax/libs/";

const jsdelivr =
"https://cdn.jsdelivr.net/";

// LOAD OCR
if(typeof Tesseract === "undefined"){
    await loadScript(
        jsdelivr +
        "npm/tesseract.js@5.1.0/dist/tesseract.min.js"
    );
}

// LOAD EXCEL
if(typeof XLSX === "undefined"){
    await loadScript(
        cdnjs +
        "xlsx/0.18.5/xlsx.full.min.js"
    );
}

// LOAD PDF
if(typeof window.jspdf === "undefined"){
    await loadScript(
        cdnjs +
        "jspdf/2.5.1/jspdf.umd.min.js"
    );
}

if(
typeof Tesseract === "undefined" ||
typeof XLSX === "undefined"
){
    statusText.innerText =
    "❌ Network Error. Refresh Page.";
    captureBtn.disabled = false;
    return;
}

// CAMERA READY CHECK
if(video.videoWidth === 0){

    statusText.innerText =
    "❌ Camera Not Ready Yet.";

    captureBtn.disabled = false;
    return;
}

statusText.innerText =
"📸 Capturing Image...";

const context =
canvas.getContext("2d");

canvas.width =
video.videoWidth;

canvas.height =
video.videoHeight;

context.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);

const imageData =
canvas.toDataURL(
"image/jpeg",
1
);

statusText.innerText =
"⚡ Scanning Text...";

const result =
await Tesseract.recognize(
imageData,
"eng",
{
logger:(m)=>{
if(
m.status === "recognizing text"
){
statusText.innerText =
`⚡ Scanning ${
Math.floor(
m.progress * 100
)
}%`;
}
}
}
);

const text =
result.data.text;

captureBtn.disabled = false;

if(!text.trim()){

statusText.innerText =
"❌ No Text Detected.";

return;
}

outputBox.value = text;

statusText.innerText =
"✅ Scan Successful";

downloadTxtBtn.disabled = false;
downloadPdfBtn.disabled = false;
downloadExcelBtn.disabled = false;

}catch(error){

console.error(error);

captureBtn.disabled = false;

statusText.innerText =
"❌ Scanner Error.";

}
});

// TXT DOWNLOAD
downloadTxtBtn.addEventListener(
"click",
()=>{

const blob =
new Blob(
[outputBox.value],
{
type:"text/plain"
}
);

const link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"ScannedText.txt";

link.click();
});

// PDF DOWNLOAD
downloadPdfBtn.addEventListener(
"click",
()=>{

try{

const {
jsPDF
} = window.jspdf;

const doc =
new jsPDF();

const lines =
doc.splitTextToSize(
outputBox.value,
180
);

doc.text(
lines,
10,
10
);

doc.save(
"ScannedDocument.pdf"
);

}catch(e){

console.error(e);

}
});

// EXCEL DOWNLOAD
downloadExcelBtn
.addEventListener(
"click",
()=>{

if(
typeof XLSX ===
"undefined"
)return;

const rawText =
outputBox.value;

const lines =
rawText.split("\n");

const rows = [];

lines.forEach(line=>{

if(line.trim()){

rows.push(
line.split(
/\s{2,}|\t/
)
);

}
});

const wb =
XLSX.utils.book_new();

const ws =
XLSX.utils
.aoa_to_sheet(rows);

XLSX.utils
.book_append_sheet(
wb,
ws,
"Scanned Data"
);

XLSX.writeFile(
wb,
"ScannedTable.xlsx"
);

});
</script>

<p style="
text-align:center;
color:#888;
font-size:14px;
margin-top:20px;
font-weight:bold;
">
Powered by Kamran Akhtar
</p>

</body>
</html>

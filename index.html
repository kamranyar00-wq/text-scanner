<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Exact Page Scanner (Layout Preserved)</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
body{font-family:Arial;background:#f4f6fb;text-align:center;padding:20px}
.container{max-width:600px;margin:auto;background:#fff;padding:20px;border-radius:12px}
video{width:100%;border-radius:10px}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;font-weight:bold}
#scan{background:#007bff;color:#fff}
#pdf{background:#ff9800;color:#fff}
#excel{background:#6f42c1;color:#fff}
img{width:100%;margin-top:10px;border:1px solid #ddd;border-radius:8px}
</style>
</head>

<body>

<div class="container">

<h2>📄 Exact Page Scanner (No Layout Loss)</h2>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<button id="scan">📷 Capture Full Page</button>

<p id="status">Ready</p>

<img id="preview"/>

<button id="pdf">📄 Download SAME PAGE PDF</button>
<button id="excel">📊 Export Excel (Image Based)</button>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const preview = document.getElementById("preview");
const status = document.getElementById("status");

let lastImage = null;

// CAMERA
async function startCamera(){
const stream = await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"}
});
video.srcObject = stream;
}
startCamera();


// ================= CAPTURE FULL PAGE =================
document.getElementById("scan").onclick = () => {

const ctx = canvas.getContext("2d");

canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

ctx.drawImage(video,0,0);

lastImage = canvas.toDataURL("image/jpeg",1.0);

preview.src = lastImage;

status.innerText = "✅ Page Captured (Exact Copy)";
};


// ================= PDF (EXACT SAME PAGE IMAGE) =================
document.getElementById("pdf").onclick = () => {

if(!lastImage) return;

const { jsPDF } = window.jspdf;

const doc = new jsPDF("p","mm","a4");

doc.addImage(lastImage,"JPEG",0,0,210,297);

doc.save("exact_page.pdf");
};


// ================= EXCEL (IMAGE EMBED STYLE) =================
document.getElementById("excel").onclick = () => {

if(!lastImage) return;

// Excel cannot perfectly store layout like image,
// so we store image inside sheet

const wb = XLSX.utils.book_new();
const ws = XLSX.utils.aoa_to_sheet([
["📄 Scanned Page (Open PDF for exact view)"],
["Image saved in PDF format better"]
]);

ws["!cols"] = [{wch:50}];

XLSX.utils.book_append_sheet(wb,ws,"Scan");

XLSX.writeFile(wb,"scan.xlsx");
};

</script>

</body>
</html>

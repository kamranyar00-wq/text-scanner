<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OCR Scanner Pro (Fixed)</title>

<!-- LIBRARIES -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial;
background:#f4f7f6;
padding:20px;
text-align:center;
}

.container{
max-width:550px;
margin:auto;
background:#fff;
padding:20px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

video{
width:100%;
height:300px;
background:black;
border-radius:10px;
object-fit:cover;
margin-bottom:15px;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

#capture-btn{background:#007bff;color:white;}
.download-btn{background:#28a745;color:white;}
#download-excel{background:#ff9800;color:white;}

textarea{
width:100%;
height:180px;
margin-top:15px;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
}

#status{
margin-top:10px;
font-weight:bold;
color:#ff5722;
}
</style>
</head>

<body>

<div class="container">

<h2>📸 OCR Scanner Pro</h2>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>

<button id="capture-btn">📷 Capture & Scan</button>

<div id="status">Starting Camera...</div>

<textarea id="output-box" placeholder="Scanned text..."></textarea>

<button id="download-txt" class="download-btn" disabled>📥 TXT</button>
<button id="download-pdf" class="download-btn" disabled>📄 PDF</button>
<button id="download-excel" class="download-btn" disabled>📊 EXCEL</button>

</div>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const captureBtn = document.getElementById("capture-btn");
const outputBox = document.getElementById("output-box");
const statusText = document.getElementById("status");

const txtBtn = document.getElementById("download-txt");
const pdfBtn = document.getElementById("download-pdf");
const excelBtn = document.getElementById("download-excel");

let stream = null;

/* ---------------- CAMERA ---------------- */
async function startCamera(){

try{

statusText.innerText = "⏳ Starting Camera...";

stream = await navigator.mediaDevices.getUserMedia({
video:{facingMode:"environment"},
audio:false
});

video.srcObject = stream;

video.setAttribute("playsinline", true);
video.setAttribute("webkit-playsinline", true);
video.muted = true;
video.autoplay = true;

await video.play();

statusText.innerText = "✅ Camera Ready";

}catch(e){
console.error(e);
statusText.innerText = "❌ Camera Blocked";
}

}

window.addEventListener("load", startCamera);

/* ---------------- OCR ---------------- */
captureBtn.addEventListener("click", async ()=>{

captureBtn.disabled = true;
outputBox.value = "";
statusText.innerText = "⏳ Loading OCR...";

if(typeof Tesseract === "undefined"){
statusText.innerText = "❌ OCR Library Missing";
captureBtn.disabled = false;
return;
}

/* CAMERA CHECK */
if(!video.videoWidth || !video.videoHeight){
statusText.innerText = "❌ Camera Not Ready";
captureBtn.disabled = false;
return;
}

/* CAPTURE */
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

const ctx = canvas.getContext("2d");
ctx.drawImage(video,0,0);

const imageData = canvas.toDataURL("image/jpeg",0.8);

/* OCR */
const result = await Tesseract.recognize(
imageData,
"eng+urd",
{
logger:m=>{
if(m.status==="recognizing text"){
statusText.innerText = `⚡ ${Math.floor(m.progress*100)}%`;
}
}
}
);

const text = result.data.text;

captureBtn.disabled = false;

if(!text.trim()){
statusText.innerText = "❌ No Text Found";
return;
}

outputBox.value = text;
statusText.innerText = "✅ Scan Complete";

txtBtn.disabled = false;
pdfBtn.disabled = false;
excelBtn.disabled = false;

});

/* ---------------- TXT ---------------- */
txtBtn.onclick=()=>{
const b=new Blob([outputBox.value],{type:"text/plain"});
const a=document.createElement("a");
a.href=URL.createObjectURL(b);
a.download="text.txt";
a.click();
};

/* ---------------- PDF ---------------- */
pdfBtn.onclick=()=>{
const {jsPDF}=window.jspdf;
const doc=new jsPDF();
doc.text(doc.splitTextToSize(outputBox.value,180),10,10);
doc.save("file.pdf");
};

/* ---------------- EXCEL ---------------- */
excelBtn.onclick=()=>{
const wb=XLSX.utils.book_new();
const ws=XLSX.utils.aoa_to_sheet(
outputBox.value.split("\n").map(r=>[r])
);
XLSX.utils.book_append_sheet(wb,ws,"data");
XLSX.writeFile(wb,"file.xlsx");
};

</script>

<!-- FOOTER -->
<p style="text-align:center;color:#888;font-size:14px;margin-top:20px;font-weight:bold;">
Powered by Kamran Akhtar
</p>

</body>
</html>

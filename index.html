<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Super Fast Free OCR & Excel Scanner</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f4f7f6;
            padding:20px;
            text-align:center;
        }

        .container{
            max-width:550px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:12px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

        h2{
            margin-bottom:15px;
            color:#333;
        }

        video{
            width:100%;
            border-radius:10px;
            background:black;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:14px;
            margin-top:10px;
            border:none;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        #capture-btn{
            background:#007bff;
            color:white;
        }

        #capture-btn:hover{
            background:#0056b3;
        }

        .download-btn{
            background:#28a745;
            color:white;
        }

        .download-btn:hover{
            background:#1f7e34;
        }

        #download-excel {
            background:#ff9800;
            color:white;
        }

        #download-excel:hover {
            background:#e68a00;
        }

        #switch-camera-btn {
            background:#6c757d;
            color:white;
        }

        #switch-camera-btn:hover {
            background:#5a6268;
        }

        button:disabled{
            background:#cccccc;
            cursor:not-allowed;
        }

        #status{
            margin-top:15px;
            font-weight:bold;
            color:#ff5722;
        }

        textarea{
            width:100%;
            height:180px;
            margin-top:15px;
            padding:12px;
            border-radius:8px;
            border:1px solid #ccc;
            resize:none;
            font-size:15px;
        }

        canvas{
            display:none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Paper To Text & Excel Scanner</h2>

    <video id="video" autoplay playsinline style="width:100%; max-height:400px; background:#000; border-radius:10px;"></video>
    <canvas id="canvas"></canvas>

    <button id="capture-btn">📷 Capture & Scan Text</button>

    <div id="status">Status: Camera Starting...</div>

    <textarea id="output-box" placeholder="Scanned text will appear here..."></textarea>

    <button id="download-txt" class="download-btn" disabled>📥 Download TXT</button>
    <button id="download-pdf" class="download-btn" disabled>📄 Download PDF</button>
    <button id="download-excel" class="download-btn" disabled>📊 Download EXCEL (.xlsx)</button>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const captureBtn = document.getElementById("capture-btn");
const outputBox = document.getElementById("output-box");
const statusText = document.getElementById("status");
const downloadTxtBtn = document.getElementById("download-txt");
const downloadPdfBtn = document.getElementById("download-pdf");
const downloadExcelBtn = document.getElementById("download-excel");

let currentStream = null;

function loadScript(src) {
    return new Promise((resolve) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = () => resolve(true);
        s.onerror = () => resolve(false);
        document.head.appendChild(s);
    });
}

// STABLE NATIVE ENVIRONMENT LOAD ENGINE
async function startCamera() {
    if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
    }

    // Direct basic parameters to load main mobile lenses instantly
    const constraints = {
        video: {
            facingMode: "environment"
        },
        audio: false
    };

    try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        statusText.innerText = "✅ Back Camera Loaded Perfectly";
    } catch (error) {
        console.error("Standard mode failed, running generic bypass...", error);
        try {
            // Ultimate native generic camera track connector
            currentStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            video.srcObject = currentStream;
            statusText.innerText = "✅ Camera Active (Auto Sync Mode)";
        } catch (finalError) {
            statusText.innerText = "❌ Camera Blocked. Please Reset Browser Permissions.";
        }
    }
}

// Auto execution loop
startCamera();

// AI GRID SCANNING SYSTEM
captureBtn.addEventListener("click", async () => {
    try {
        captureBtn.disabled = true;
        outputBox.value = "";
        statusText.innerText = "⏳ Connecting Core Components...";

        const cdnjs = "https://" + "://cloudflare.com";
        const jsdelivr = "https://" + "cdn.jsdelivr.net/";

        if (typeof Tesseract === "undefined") {
            await loadScript(jsdelivr + "npm/tesseract.js@5.1.0/dist/tesseract.min.js");
        }
        if (typeof XLSX === "undefined") {
            await loadScript(cdnjs + "xlsx/0.18.5/xlsx.full.min.js");
        }
        if (typeof window.jspdf === "undefined") {
            await loadScript(cdnjs + "jspdf/2.5.1/jspdf.umd.min.js");
        }

        if (typeof Tesseract === "undefined" || typeof XLSX === "undefined") {
            statusText.innerText = "❌ Network Core Error. Refresh Page.";
            captureBtn.disabled = false;
            return;
        }

        statusText.innerText = "⏳ Capturing Sharp Frame...";
        const context = canvas.getContext("2d");
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = canvas.toDataURL("image/jpeg", 0.85);

        statusText.innerText = "⚡ Initializing Core Processing...";

        Tesseract.recognize(
            imageData,
            'eng',
            { logger: m => {
                if(m.status === 'recognizing') {
                    statusText.innerText = `⚡ Scanning: ${Math.floor(m.progress * 100)}%`;
                }
            }}
        ).then(({ data: { text } }) => {
            captureBtn.disabled = false;

            if (!text || text.trim() === "") {
                statusText.innerText = "❌ Text Not Detected. Try Again.";
            } else {
                outputBox.value = text;
                statusText.innerText = "✅ Free Scan Successful";

                downloadTxtBtn.disabled = false;
                downloadPdfBtn.disabled = false;
                downloadExcelBtn.disabled = false;
            }
        }).catch(err => {
            console.error(err);
            captureBtn.disabled = false;
            statusText.innerText = "❌ Scanner Grid Error.";
        });

    } catch (error) {
        console.error(error);
        captureBtn.disabled = false;
        statusText.innerText = "❌ Fatal System Crash";
    }
});

// DOWNLOAD TXT
downloadTxtBtn.addEventListener("click", () => {
    const blob = new Blob([outputBox.value], { type: "text/plain" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "ScannedText.txt";
    link.click();
});

// DOWNLOAD PDF
downloadPdfBtn.addEventListener("click", () => {
    try {
        const { jsPDF } = window.jspdf ? window.jspdf : window;
        if (!jsPDF) return;
        const doc = new jsPDF();
        const lines = doc.splitTextToSize(outputBox.value, 180);
        doc.text(lines, 10, 10);
        doc.save("ScannedDocument.pdf");
    } catch (e) {
        console.error(e);
    }
});

// DOWNLOAD EXCEL 
downloadExcelBtn.addEventListener("click", () => {
    if (typeof XLSX === "undefined") return;
    const rawText = outputBox.value;
    const lines = rawText.split('\n');
    const excelRows = [];
    
    lines.forEach(line => {
        if(line.trim() !== "") {
            const columns = line.split(/\s{2,}|\t/);
            excelRows.push(columns);
        }
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(excelRows);
    XLSX.utils.book_append_sheet(wb, ws, "Scanned Data");
    XLSX.writeFile(wb, "ScannedTable.xlsx");
});
</script>

<p style="text-align: center; color: #888888; font-size: 14px; margin-top: 20px; font-weight: bold;">
    Powered by Kamran Akhtar
</p>
</body>
</html>
